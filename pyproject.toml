[project]
name = "capy"
version = "0.1.0"
description = "Census geography pipelines and residential segregation analysis."
readme = "README.md"
# Checksum publication uses hashlib.file_digest; NetworkX excludes Python 3.14.1.
requires-python = ">=3.11,!=3.14.1,<4.0"
dependencies = [
    # GerryChain 0.3.2 imports the use_pygeos option removed in GeoPandas 1.2.
    "geopandas>=1.0,<1.2",
    # GerryChain 1 requires pandas 3; ipumspy 0.8 requires pandas below 3.
    "gerrychain>=0.3.2,<1",
    "ipumspy>=0.8.2,<0.9",
    "matplotlib>=3.5",
    "networkx>=3.5,<4",
    # Saving NPZ files with allow_pickle=False requires NumPy 2.2.
    "numpy>=2.2,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3,<3",
    "pillow>=9",
    "pyarrow>=23,<24",
    "pydantic>=2.11,<3",
    "pyogrio>=0.13,<1",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
    "requests>=2.28,<3",
    # CIELAB interpolation preserves the factorization figures' quadrant colors.
    "scikit-image>=0.25,<1",
    # SciPy 1.13 supports NumPy 2 and the sparse array constructors used here.
    "scipy>=1.13",
    "shapely>=2.0,<3",
    "tqdm>=4.64.0,<5",
    # us 3 omits Washington, DC from default state lookups.
    "us>=2.0.2,<3",
    "xlrd>=2.0.1,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.9,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.ruff]
line-length = 100
extend-exclude = ["code/archive"]
